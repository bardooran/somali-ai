name: GiellaLT Runtime Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/morphology_benchmark.py"
      - "src/morphology_comparison.py"
      - "src/giellalt_runtime_benchmark.py"
      - "src/morphology_challenge_v2.py"
      - "src/morphology_challenge_v2_comparison.py"
      - "src/giellalt_challenge_v2.py"
      - "src/morphology_challenge_v3.py"
      - "src/morphology_challenge_v3_comparison.py"
      - "src/morphology_challenge_v3_gap_audit.py"
      - "src/giellalt_challenge_v3.py"
      - "src/morphology_challenge_v4.py"
      - "src/morphology_challenge_v4_comparison.py"
      - "src/giellalt_challenge_v4.py"
      - "src/master_recognition.py"
      - "tests/test_morphology_comparison.py"
      - "tests/test_giellalt_runtime_benchmark.py"
      - "tests/test_morphology_challenge_v2_frozen.py"
      - "tests/test_morphology_challenge_v2_scoring.py"
      - "tests/test_morphology_challenge_v3_scoring.py"
      - "tests/test_morphology_challenge_v3_diagnostics.py"
      - "tests/test_morphology_challenge_v4_scoring.py"
      - "data/qa/morphology_benchmark_v1.jsonl"
      - "data/qa/morphology_challenge_v2.jsonl"
      - "data/qa/morphology_challenge_v2.meta.json"
      - "data/qa/morphology_challenge_v3.jsonl"
      - "data/qa/morphology_challenge_v3.meta.json"
      - "data/qa/morphology_challenge_v4.jsonl"
      - "data/qa/morphology_challenge_v4.meta.json"
      - "data/master/recognition_index.jsonl"
      - "data/master/recognition_index.meta.json"
      - "data/imported/giellalt/lexical_candidates.jsonl"
      - "data/usage/external/wikipedia_usage_candidates.jsonl"
      - "data/usage/external/xlsum_usage_candidates.jsonl"
      - ".github/workflows/giellalt-runtime.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Somali AI
        uses: actions/checkout@v4

      - name: Check out pinned GiellaLT Somali source
        uses: actions/checkout@v4
        with:
          repository: bardooran/GiellaLT
          ref: 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d
          path: external/lang-som

      - name: Install GiellaLT build dependencies
        run: |
          wget https://apertium.projectjj.com/apt/install-nightly.sh -O - | sudo bash
          sudo apt-get install -y cg3 hfst
          pipx install git+https://github.com/divvun/GiellaLTGramTools/
          pipx inject giellaltgramtools click
          pipx install git+https://github.com/divvun/GiellaLTLexTools/
          pipx install git+https://github.com/divvun/morph-test

      - name: Build GiellaLT analyzer
        working-directory: external/lang-som
        run: |
          ./autogen.sh
          ./configure
          make -j2

      - name: Locate compiled analyzer
        id: analyzer
        shell: bash
        run: |
          for candidate in \
            external/lang-som/src/fst/analyser-gt-norm.hfstol \
            external/lang-som/src/fst/analyser-gt-desc.hfstol \
            external/lang-som/src/fst/analyser-gt-norm.hfst \
            external/lang-som/src/fst/analyser-gt-desc.hfst; do
            if test -f "$candidate"; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using $candidate"
              exit 0
            fi
          done
          echo "No compiled GiellaLT analyzer found" >&2
          exit 1

      - name: Run Somali AI benchmark v1
        run: python -m src.morphology_benchmark > somali-ai-benchmark-v1.json

      - name: Run frozen v1 benchmark against compiled GiellaLT FST
        run: |
          python -m src.giellalt_runtime_benchmark \
            --analyzer "${{ steps.analyzer.outputs.path }}" \
            --giellalt-commit 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d \
            > giellalt-runtime-benchmark-v1.json

      - name: Build v1 side-by-side comparison
        run: |
          python -m src.morphology_comparison \
            --somali-ai somali-ai-benchmark-v1.json \
            --giellalt giellalt-runtime-benchmark-v1.json \
            > morphology-comparison-v1.json
          cat morphology-comparison-v1.json

      - name: Run Somali AI analyzer-blind challenge v2
        run: python -m src.morphology_challenge_v2 > somali-ai-challenge-v2.json

      - name: Run analyzer-blind challenge v2 against compiled GiellaLT FST
        run: |
          python -m src.giellalt_challenge_v2 \
            --analyzer "${{ steps.analyzer.outputs.path }}" \
            --giellalt-commit 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d \
            > giellalt-challenge-v2.json

      - name: Build v2 side-by-side comparison
        run: |
          python -m src.morphology_challenge_v2_comparison \
            --somali-ai somali-ai-challenge-v2.json \
            --giellalt giellalt-challenge-v2.json \
            > morphology-comparison-v2.json
          cat morphology-comparison-v2.json

      - name: Run Somali AI frozen challenge v3
        run: python -m src.morphology_challenge_v3 > somali-ai-challenge-v3.json

      - name: Build diagnostic-only v3 gap audit
        run: python -m src.morphology_challenge_v3_gap_audit > morphology-v3-gap-audit.json

      - name: Run frozen challenge v3 against compiled GiellaLT FST
        run: |
          python -m src.giellalt_challenge_v3 \
            --analyzer "${{ steps.analyzer.outputs.path }}" \
            --giellalt-commit 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d \
            > giellalt-challenge-v3.json

      - name: Build v3 three-way comparison
        run: |
          python -m src.morphology_challenge_v3_comparison \
            --somali-ai somali-ai-challenge-v3.json \
            --giellalt giellalt-challenge-v3.json \
            > morphology-comparison-v3.json
          cat morphology-comparison-v3.json

      - name: Run Somali AI frozen challenge v4 baseline
        run: |
          python -m src.morphology_challenge_v4 > somali-ai-challenge-v4.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('somali-ai-challenge-v4.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'reviewed': value['reviewed']['score'],
              'master': value['master']['score'],
              'master_per_pos': value['master']['per_pos'],
          }, indent=2, sort_keys=True))
          PY

      - name: Run frozen challenge v4 against compiled GiellaLT FST
        run: |
          python -m src.giellalt_challenge_v4 \
            --analyzer "${{ steps.analyzer.outputs.path }}" \
            --giellalt-commit 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d \
            > giellalt-challenge-v4.json

      - name: Build v4 three-way baseline comparison
        run: |
          python -m src.morphology_challenge_v4_comparison \
            --somali-ai somali-ai-challenge-v4.json \
            --giellalt giellalt-challenge-v4.json \
            > morphology-comparison-v4.json
          cat morphology-comparison-v4.json

      - name: Upload reproducible benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: morphology-benchmark-v1-v2-v3-v4
          path: |
            somali-ai-benchmark-v1.json
            giellalt-runtime-benchmark-v1.json
            morphology-comparison-v1.json
            somali-ai-challenge-v2.json
            giellalt-challenge-v2.json
            morphology-comparison-v2.json
            somali-ai-challenge-v3.json
            morphology-v3-gap-audit.json
            giellalt-challenge-v3.json
            morphology-comparison-v3.json
            somali-ai-challenge-v4.json
            giellalt-challenge-v4.json
            morphology-comparison-v4.json
