name: GiellaLT Runtime Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/morphology_benchmark.py"
      - "src/morphology_comparison.py"
      - "src/giellalt_runtime_benchmark.py"
      - "tests/test_morphology_comparison.py"
      - "tests/test_giellalt_runtime_benchmark.py"
      - "data/qa/morphology_benchmark_v1.jsonl"
      - ".github/workflows/giellalt-runtime.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Somali AI
        uses: actions/checkout@v4

      - name: Check out pinned GiellaLT Somali source
        uses: actions/checkout@v4
        with:
          repository: bardooran/GiellaLT
          ref: 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d
          path: external/lang-som

      - name: Install GiellaLT build dependencies
        run: |
          wget https://apertium.projectjj.com/apt/install-nightly.sh -O - | sudo bash
          sudo apt-get install -y cg3 hfst
          pipx install git+https://github.com/divvun/GiellaLTGramTools/
          pipx inject giellaltgramtools click
          pipx install git+https://github.com/divvun/GiellaLTLexTools/
          pipx install git+https://github.com/divvun/morph-test

      - name: Build GiellaLT analyzer
        working-directory: external/lang-som
        run: |
          ./autogen.sh
          ./configure
          make -j2

      - name: Locate compiled analyzer
        id: analyzer
        shell: bash
        run: |
          for candidate in \
            external/lang-som/src/fst/analyser-gt-norm.hfstol \
            external/lang-som/src/fst/analyser-gt-desc.hfstol \
            external/lang-som/src/fst/analyser-gt-norm.hfst \
            external/lang-som/src/fst/analyser-gt-desc.hfst; do
            if test -f "$candidate"; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using $candidate"
              exit 0
            fi
          done
          echo "No compiled GiellaLT analyzer found" >&2
          exit 1

      - name: Run Somali AI benchmark v1
        run: python -m src.morphology_benchmark > somali-ai-benchmark-v1.json

      - name: Run frozen benchmark against compiled GiellaLT FST
        run: |
          python -m src.giellalt_runtime_benchmark \
            --analyzer "${{ steps.analyzer.outputs.path }}" \
            --giellalt-commit 5278929712e9c0c67f254f1a1dc64c80ea7b2b8d \
            > giellalt-runtime-benchmark-v1.json

      - name: Build side-by-side comparison
        run: |
          python -m src.morphology_comparison \
            --somali-ai somali-ai-benchmark-v1.json \
            --giellalt giellalt-runtime-benchmark-v1.json \
            > morphology-comparison-v1.json
          cat morphology-comparison-v1.json

      - name: Upload reproducible benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: morphology-benchmark-v1
          path: |
            somali-ai-benchmark-v1.json
            giellalt-runtime-benchmark-v1.json
            morphology-comparison-v1.json
