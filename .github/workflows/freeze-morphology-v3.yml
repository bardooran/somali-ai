name: Freeze Morphology Challenge v3

on:
  push:
    branches: [main]
    paths:
      - "src/morphology_challenge_v3_freeze.py"
      - "tests/test_morphology_challenge_v3_freeze.py"
      - "docs/MORPHOLOGY_CHALLENGE_V3.md"
      - "data/qa/morphology_challenge_v2.jsonl"
      - ".github/workflows/freeze-morphology-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Somali AI
        uses: actions/checkout@v4

      - name: Check out pinned Qaamuus source
        uses: actions/checkout@v4
        with:
          repository: bardooran/goobolabs
          ref: 737cf848bfa8291d5580f5c34db04daef858c955
          path: external/goobolabs

      - name: Generate disjoint analyzer-blind v3 manifest
        run: |
          mkdir -p benchmark_results
          python -m src.morphology_challenge_v3_freeze \
            --source-root external/goobolabs/resources/qaamuus \
            --v2 data/qa/morphology_challenge_v2.jsonl \
            --output benchmark_results/morphology_challenge_v3.jsonl \
            --metadata benchmark_results/morphology_challenge_v3.meta.json
          sha256sum benchmark_results/morphology_challenge_v3.jsonl

      - name: Prove v3 generator has no analyzer dependency
        run: |
          if grep -Eq 'hfst-lookup|morphology_candidates|giellalt_runtime_benchmark|giellalt_challenge' src/morphology_challenge_v3_freeze.py; then
            echo "v3 freeze generator unexpectedly references analyzer code" >&2
            exit 1
          fi

      - name: Verify v2 disjointness and frozen identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = Path('benchmark_results/morphology_challenge_v3.jsonl')
          expected_sha = '7222ef7a4e4f0c9b960b5feece50aaba11737dc7f3265040cfdac6a3e99ffd6c'
          actual_sha = hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert actual_sha == expected_sha, (actual_sha, expected_sha)

          v2 = {
              json.loads(line)['surface'].casefold()
              for line in Path('data/qa/morphology_challenge_v2.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip() and json.loads(line).get('split') == 'challenge'
          }
          v3 = [
              json.loads(line)
              for line in manifest.read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          positive = {case['surface'].casefold() for case in v3 if case['split'] == 'challenge'}
          assert not (v2 & positive)
          meta = json.loads(Path('benchmark_results/morphology_challenge_v3.meta.json').read_text(encoding='utf-8'))
          assert meta['v2_positive_overlap_count'] == 0
          assert meta['selection_is_analyzer_blind'] is True
          assert meta['definitions_copied'] is False
          assert meta['manifest_sha256'] == expected_sha
          assert meta['positive_case_count'] == 110
          assert meta['unknown_probe_count'] == 16
          PY

      - name: Upload frozen v3 candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: morphology-challenge-v3-freeze
          path: benchmark_results/
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact frozen v3 benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/qa
          cp benchmark_results/morphology_challenge_v3.jsonl data/qa/morphology_challenge_v3.jsonl
          cp benchmark_results/morphology_challenge_v3.meta.json data/qa/morphology_challenge_v3.meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qa/morphology_challenge_v3.jsonl data/qa/morphology_challenge_v3.meta.json
          if git diff --cached --quiet; then
            echo "Frozen v3 benchmark already committed"
            exit 0
          fi
          git commit -m "Freeze analyzer-blind morphology challenge v3"
          git pull --rebase origin main
          git push origin HEAD:main
