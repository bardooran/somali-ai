name: Refresh external candidates

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-external-candidates.yml"
      - "tools/importers/giellalt_extract.py"
      - "tools/importers/giellalt_grammar_extract.py"
      - "tools/importers/sls_extract.py"
      - "tests/test_external_candidate_data.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Somali AI project
        uses: actions/checkout@v4
        with:
          path: somali-ai
          fetch-depth: 1

      - name: Check out GiellaLT mirror
        uses: actions/checkout@v4
        with:
          repository: bardooran/GiellaLT
          path: GiellaLT
          fetch-depth: 1

      - name: Check out SLS mirror
        uses: actions/checkout@v4
        with:
          repository: bardooran/goobolabs
          path: SLS
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract provenance-rich candidates
        working-directory: somali-ai
        shell: bash
        run: |
          set -euo pipefail
          GIELLALT_SHA="$(git -C ../GiellaLT rev-parse HEAD)"
          SLS_SHA="$(git -C ../SLS rev-parse HEAD)"

          python tools/importers/giellalt_extract.py ../GiellaLT \
            --source-commit "$GIELLALT_SHA" \
            --output data/imported/giellalt/lexical_candidates.jsonl

          python tools/importers/giellalt_grammar_extract.py ../GiellaLT \
            --source-commit "$GIELLALT_SHA" \
            --output data/imported/giellalt/grammar_candidates.jsonl

          python tools/importers/sls_extract.py ../SLS \
            --source-commit "$SLS_SHA" \
            --output data/imported/sls/rule_candidates.jsonl

          test -s data/imported/giellalt/lexical_candidates.jsonl
          test -s data/imported/giellalt/grammar_candidates.jsonl
          test -s data/imported/sls/rule_candidates.jsonl

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          paths = {
              "giella_lexical": Path("data/imported/giellalt/lexical_candidates.jsonl"),
              "giella_grammar": Path("data/imported/giellalt/grammar_candidates.jsonl"),
              "sls_rules": Path("data/imported/sls/rule_candidates.jsonl"),
          }
          rows = {
              key: [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              for key, path in paths.items()
          }
          assert all(rows.values())
          assert all(row["promotion_allowed"] is False for values in rows.values() for row in values)
          print("GiellaLT lexical:", len(rows["giella_lexical"]), Counter(row["record_type"] for row in rows["giella_lexical"]))
          print("GiellaLT grammar:", len(rows["giella_grammar"]), Counter(row["record_type"] for row in rows["giella_grammar"]))
          print("SLS rules:", len(rows["sls_rules"]))
          PY

      - name: Run full project tests against generated candidates
        working-directory: somali-ai
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Print competitive morphology scoreboard
        working-directory: somali-ai
        run: python -m src.morphology_competition

      - name: Commit refreshed candidate datasets
        working-directory: somali-ai
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imported/giellalt/lexical_candidates.jsonl \
                  data/imported/giellalt/grammar_candidates.jsonl \
                  data/imported/sls/rule_candidates.jsonl
          if git diff --cached --quiet; then
            echo "Candidate datasets are already current."
            exit 0
          fi
          git commit -m "Refresh external Somali candidate datasets"
          git pull --rebase origin main
          git push origin HEAD:main
